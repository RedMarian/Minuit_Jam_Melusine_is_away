<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Note: Unity's template preprocessor treats lines starting with "#" as directives, so no CSS id selectors at line start. -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: {{{ BACKGROUND_COLOR }}}; }
      canvas.unity { display: block; width: 100%; height: 100%; }
      div.loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 60%; max-width: 300px; height: 6px; background: rgba(255,255,255,0.2); }
      div.loading > div { width: 0; height: 100%; background: #fff; }
      div.scan-overlay { display: none; position: fixed; inset: 0; z-index: 10; background: #000; }
      div.scan-overlay > div.scan-view { position: absolute; inset: 0; overflow: hidden; }
      button.scan-cancel { position: absolute; top: 16px; right: 16px; z-index: 20; padding: 10px 16px; font: 16px sans-serif; color: #fff; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.6); border-radius: 8px; }
    </style>

    <!-- MindAR (image tracking, three.js build) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";
      window.MindARThree = MindARThree;
    </script>
  </head>
  <body>
    <canvas id="unity-canvas" class="unity" tabindex="-1"></canvas>
    <div id="unity-loading" class="loading"><div id="unity-progress"></div></div>

    <div id="scan-overlay" class="scan-overlay">
      <div id="scan-view" class="scan-view"></div>
      <button id="scan-cancel" class="scan-cancel" type="button">Cancel</button>
    </div>

    <script>
      // ---------- Unity loader ----------
      var canvas = document.getElementById("unity-canvas");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      };

      var loaderScript = document.createElement("script");
      loaderScript.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      loaderScript.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("unity-progress").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          document.getElementById("unity-loading").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(loaderScript);

      // ---------- MindAR scanner (called from Scanner.jslib) ----------
      var mindar = null;
      var receiver = null;
      var overlay = document.getElementById("scan-overlay");
      var view = document.getElementById("scan-view");

      function sendToUnity(method, arg) {
        if (!window.unityInstance || !receiver) return;
        if (arg === undefined) window.unityInstance.SendMessage(receiver, method);
        else window.unityInstance.SendMessage(receiver, method, arg);
      }

      function teardown() {
        var instance = mindar;
        mindar = null;
        if (instance) {
          try { instance.stop(); } catch (e) { /* stop() throws if start() never got the camera */ }
          try { instance.renderer.dispose(); } catch (e) {}
        }
        view.innerHTML = "";
        overlay.style.display = "none";
      }

      window.mindarStartScan = async function (receiverName, targetUrl, targetCount) {
        if (mindar) return;
        receiver = receiverName;
        if (!window.MindARThree) {
          sendToUnity("OnScanError", "MindAR failed to load (offline or blocked CDN?)");
          return;
        }

        overlay.style.display = "block";
        var instance = new window.MindARThree({
          container: view,
          imageTargetSrc: targetUrl,
          maxTrack: 1,
          uiLoading: "yes",
          uiScanning: "yes",
          uiError: "no",
        });
        mindar = instance;

        // One anchor per image in the .mind file; whichever is seen first wins.
        for (var i = 0; i < Math.max(1, targetCount); i++) {
          (function (index) {
            instance.addAnchor(index).onTargetFound = function () {
              if (mindar !== instance) return;
              teardown();
              sendToUnity("OnImageFound", String(index));
            };
          })(i);
        }

        try {
          await instance.start();
        } catch (e) {
          if (mindar !== instance) return; // cancelled while starting
          teardown();
          sendToUnity("OnScanError", String(e && e.message ? e.message : e));
          return;
        }

        // Cancelled while the camera was starting: release it now.
        if (mindar !== instance) {
          try { instance.stop(); } catch (e) {}
          try { instance.renderer.dispose(); } catch (e) {}
        }
      };

      window.mindarStopScan = function () {
        teardown();
      };

      document.getElementById("scan-cancel").addEventListener("click", function () {
        if (!mindar) return;
        teardown();
        sendToUnity("OnScanCancelled");
      });
    </script>
  </body>
</html>
